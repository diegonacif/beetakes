<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0c">
<title>Terreno em Ponta Negra · 360° | Bee Takes</title>
<meta name="description" content="Vista aérea em 360° do terreno em Ponta Negra, Natal. Arraste para olhar em volta.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bee Takes">
<meta property="og:title" content="Terreno em Ponta Negra · 360°">
<meta property="og:description" content="Vista aérea em 360°. Arraste para olhar em volta.">
<meta property="og:url" content="https://www.beetakes.com.br/360/alessandra-lisboa/terreno-pn">
<meta property="og:image" content="https://www.beetakes.com.br/360/alessandra-lisboa/terreno-pn/capa.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/bee-takes.png">
<link rel="stylesheet" href="/360/_pannellum/2.5.6/pannellum.css">
<script src="/360/_pannellum/2.5.6/pannellum.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
  #pano { position: fixed; inset: 0; }
  .pnlm-panorama-info { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .pnlm-title-box { font-size: 18px; }
  .pnlm-author-box a { color: #ffc400; }
  #dica {
    position: fixed; left: 50%; bottom: max(72px, calc(env(safe-area-inset-bottom) + 72px));
    transform: translateX(-50%); z-index: 10; pointer-events: none;
    padding: 10px 16px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff;
    font: 500 15px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; white-space: nowrap;
    transition: opacity .6s ease;
  }
  #dica.sumir { opacity: 0; }
</style>
</head>
<body>
<div id="pano"></div>
<div id="dica">Arraste para olhar em volta</div>
<script>
  // A pasta dos blocos fica ao lado desta página, com ou sem barra no fim do endereço.
  var base = location.pathname.replace(/\/(index\.html)?$/, '');
  var retrato = window.innerHeight > window.innerWidth;

  var viewer = pannellum.viewer('pano', {
    type: 'multires',
    multiRes: {
      basePath: base + '/tiles',
      path: '/%l/%s%y_%x',
      fallbackPath: '/fallback/%s',
      extension: 'jpg',
      tileResolution: 512,
      maxLevel: 5,
      cubeResolution: 5088
    },
    autoLoad: true,
    yaw: 5,
    pitch: retrato ? -25 : -16,
    hfov: retrato ? 65 : 100,
    minHfov: 30,
    maxHfov: 120,
    autoRotate: -2,
    showFullscreenCtrl: true,
    title: 'Terreno em Ponta Negra',
    author: 'Bee Takes',
    authorURL: 'https://www.instagram.com/bee.takes',
    strings: {
      loadButtonLabel: 'Toque para<br>abrir a<br>imagem 360°',
      loadingLabel: 'Carregando...',
      bylineLabel: 'Imagem 360° por %s',
      noPanoramaError: 'Nenhuma imagem foi indicada.',
      fileAccessError: 'Não foi possível abrir o arquivo %s.',
      malformedURLError: 'O endereço da imagem está com problema.',
      iOS8WebGLError: 'Este aparelho não consegue mostrar a imagem 360°.',
      genericWebGLError: 'Este navegador não consegue mostrar a imagem 360°. Tente outro navegador.',
      textureSizeError: 'A imagem é grande demais para este aparelho (%spx; o limite dele é %spx). Tente outro aparelho.',
      unknownError: 'Erro inesperado ao abrir a imagem 360°.'
    }
  });

  var dica = document.getElementById('dica');
  function esconderDica() { dica.classList.add('sumir'); }
  ['mousedown', 'touchstart', 'wheel', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, esconderDica, { once: true, passive: true });
  });
  setTimeout(esconderDica, 7000);
</script>
</body>
</html>
